name: Spot On Track diagnostic (temporary)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run diagnostic
        env:
          SOT_API_KEY: ${{ secrets.SOT_API_KEY }}
        run: python scripts/sot_diag.py
