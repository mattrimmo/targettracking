name: Daily signals (Songstats)
on:
  schedule:
    # 05:45 UTC daily — after the weekly sync's 05:17 slot on Wednesdays,
    # so they don't land at the exact same moment even though they're
    # serialized anyway via the shared concurrency group below.
    - cron: "45 5 * * *"
  workflow_dispatch: {}
concurrency:
  group: sync-workflow
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Run signals
        # Everything else Songstats has: streams, socials, radio, 1001Tracklists,
        # SoundCloud, Beatport, DSP editorial adds. Writes data/signals.json.
        env:
          SONGSTATS_API_KEY: ${{ secrets.SONGSTATS_API_KEY }}
        run: python scripts/signals.py
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "listenup-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/signals.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Signals: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
