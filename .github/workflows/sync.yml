name: Sync Long Term Target Tracking

on:
  schedule:
    - cron: "17 5 * * 3"   # 05:17 UTC every Wednesday: the OFFICIAL weekly snapshot
  workflow_dispatch:
    inputs:
      official:
        description: "Treat this run as the official weekly snapshot"
        type: boolean
        default: false

concurrency:
  group: sync-workflow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Configure git
        run: |
          git config user.name "listenup-tracker-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run sync
        env:
          SONGSTATS_API_KEY: ${{ secrets.SONGSTATS_API_KEY }}
          IS_OFFICIAL: ${{ github.event.schedule == '17 5 * * 3' || inputs.official == true }}
        run: python scripts/sync.py

      - name: Final safety-net commit
        if: always()
        run: |
          git add data/history.json data/tracked.json
          git diff --cached --quiet && echo "Nothing left uncommitted" || git commit -m "Sync: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push || true
