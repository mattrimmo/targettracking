name: Sync Long Term Target Tracking

on:
  schedule:
    - cron: "17 5 * * 3"   # 05:17 UTC every Wednesday — see earlier notes on why this time
  workflow_dispatch:
    inputs:
      official:
        description: "Treat this run as the official weekly snapshot"
        type: boolean
        default: false

concurrency:
  group: sync-workflow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Configure git
        run: |
          git config user.name "listenup-tracker-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run sync
        env:
          SOT_API_KEY: ${{ secrets.SOT_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IS_OFFICIAL: ${{ github.event_name == 'schedule' || inputs.official == true }}
        run: python scripts/sync.py

      - name: Final safety-net commit
        if: always()
        run: |
          git add data/history.json data/playlist_cache.json data/spotify_call_log.json
          git diff --cached --quiet && echo "Nothing left uncommitted" || git commit -m "Sync: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push || true
