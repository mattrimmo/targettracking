name: Daily campaign sync

on:
  schedule:
    # 06:00 UTC daily — adjust if you want it aligned to a different time
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # lets you trigger a manual run from the Actions tab

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Configure git
        run: |
          git config user.name "campaign-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run sync
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SOT_API_KEY: ${{ secrets.SOT_API_KEY }}
        # sync.py commits + pushes a checkpoint after every campaign itself,
        # so progress survives even if this step gets killed by the
        # timeout-minutes limit above.
        run: python scripts/sync.py

      - name: Final safety-net commit
        if: always()
        run: |
          git add data/history.json data/playlist_cache.json
          git diff --cached --quiet && echo "Nothing left uncommitted" || git commit -m "Daily sync: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push || true
