name: Sync Long Term Target Tracking

on:
  schedule:
    # 05:17 UTC every Wednesday — 06:17 BST / 05:17 GMT. Picked deliberately
    # early and off the exact hour: GitHub's scheduled triggers can run late
    # during high load, which tends to cluster right on the hour (lots of
    # repos fire at :00). This leaves a ~2.5-3hr buffer before a 9am arrival,
    # even accounting for a delayed run.
    - cron: "17 5 * * 3"
  workflow_dispatch:
    inputs:
      official:
        description: "Treat this run as the official weekly snapshot (normally only the Wednesday schedule does this)"
        type: boolean
        default: false

concurrency:
  group: sync-workflow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sync
        env:
          SOT_API_KEY: ${{ secrets.SOT_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          # The scheduled trigger is always official; a manual run is official
          # only if the "official" checkbox was ticked when triggering it.
          IS_OFFICIAL: ${{ github.event_name == 'schedule' || inputs.official == true }}
        run: python scripts/sync.py

      - name: Commit updated data
        run: |
          git config user.name "listenup-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Sync: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
