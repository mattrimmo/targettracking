<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen Up — Long Term Target Tracking</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%277%27%20fill=%27%237c5cf0%27/%3E%3Cpolyline%20points=%276%2C24%2012.5%2C17%2017.5%2C20%2024.5%2C9%27%20fill=%27none%27%20stroke=%27%23fff%27%20stroke-width=%273%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27/%3E%3Ccircle%20cx=%2725%27%20cy=%278%27%20r=%273.6%27%20fill=%27%23fff%27/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #101014;
    --panel: #16161b;
    --surface: #1b1b21;
    --surface2: #212129;
    --border: rgba(255,255,255,0.06);
    --border2: rgba(255,255,255,0.13);
    --text: #f2f2f4;
    --muted: #9a9aa3;
    --faint: #55555f;
    --accent: #5b7cfa;
    --accent-hover: #7292ff;
    --up: #34d399;
    --down: #f87171;
    --gold: #e8b95c;
    --silver: #b9bcc6;
    --bronze: #c98a54;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.5; }
  .shell { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
  .side { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; overflow-y: auto; }
  .side-top { padding: 22px 20px 16px; border-bottom: 1px solid var(--border); }
  .logo { height: 42px; filter: invert(1); display: block; margin-bottom: 12px; opacity: 0.95; }
  .logo-fallback { display:none; font-family: var(--sans); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; margin-bottom: 12px; }
  .logo-fallback .bar { display:inline-block; width:16px; height:4px; background:var(--accent); border-radius:2px; margin-right:8px; vertical-align:middle; }
  .side-title { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: -0.005em; }
  .side-sub { font-size: 11px; color: var(--faint); margin-top: 2px; }
  .side-block { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .block-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin-bottom: 9px; display:flex; justify-content:space-between; align-items:center; }
  .block-label button.link { background:none; border:none; color:var(--faint); font-size: 11px; cursor:pointer; text-transform:none; letter-spacing:0; font-weight:500; }
  .block-label button.link:hover { color: var(--accent); }
  input[type=text], input[type=password] {
    width: 100%; background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 8px; padding: 9px 11px; color: var(--text); font-family: var(--sans);
    font-size: 13.5px; outline: none; transition: border-color 0.15s;
  }
  input[type=text]:focus, input[type=password]:focus { border-color: var(--accent); }
  input::placeholder { color: var(--faint); }
  .field-label { font-size: 10px; color: var(--faint); letter-spacing: 0.05em; text-transform: uppercase; display:block; margin: 9px 0 4px; font-weight: 600; }
  .field-label:first-child { margin-top: 0; }
  .btn-accent {
    display: block; width: 100%; margin-top: 9px;
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 9px; font-family: var(--sans); font-size: 13.5px; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-accent:hover { background: #6f8bff; }
  .btn-accent:disabled { background: var(--surface2); color: var(--faint); cursor: not-allowed; }
  .notice { font-size: 12.5px; margin-top: 8px; padding: 7px 10px; border-radius: 7px; display: none; line-height: 1.4; }
  .notice.show { display: block; }
  .notice.loading { background: rgba(255,255,255,0.04); color: var(--muted); border: 1px solid var(--border2); }
  .notice.error   { background: rgba(248,113,113,0.1); color: var(--down); border: 1px solid rgba(248,113,113,0.2); }
  .notice.success { background: rgba(52,211,153,0.08); color: var(--up); border: 1px solid rgba(52,211,153,0.18); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid rgba(91,124,250,0.3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
  .results { display: flex; flex-direction: column; gap: 6px; margin-top: 9px; }
  .result-item { display: flex; align-items: center; gap: 9px; padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: border-color 0.12s, background 0.12s; }
  .result-item:hover { border-color: var(--accent); background: var(--surface2); }
  .result-art { width: 32px; height: 32px; border-radius: 5px; background: var(--surface2); object-fit: cover; flex-shrink: 0; }
  .result-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .tracked-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; cursor: pointer; color: var(--muted); }
  .tracked-item:last-child { border-bottom: none; }
  .tracked-item:hover { color: var(--accent); }
  .tracked-item .rm { margin-left: auto; background: none; border: none; color: var(--faint); font-size: 16px; cursor: pointer; padding: 0 4px; flex-shrink:0; }
  .tracked-item .rm:hover { color: var(--down); }
  .debug-area { padding: 12px 20px 18px; margin-top: auto; border-top: 1px solid var(--border); }
  .debug-label { font-size: 10px; color: var(--faint); margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; }
  .debug-clear { background: none; border: none; color: var(--faint); font-size: 10px; cursor: pointer; padding: 0; }
  #debugBox { font-size: 10px; color: var(--faint); font-family: var(--mono); background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 8px; height: 80px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
  .main { display: flex; flex-direction: column; min-height: 100vh; }
  .main-header { padding: 24px 36px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .main-title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .main-sub { font-size: 12.5px; color: var(--faint); margin-top: 3px; }
  .content { padding: 24px 36px 40px; flex: 1; display: flex; flex-direction: column; gap: 20px; max-width: 1560px; width: 100%; margin: 0 auto; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--faint); text-align: center; padding: 40px; }
  .empty-icon { font-size: 38px; opacity: 0.2; }

  .track-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 22px 24px; }
  .track-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .track-name { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .track-meta { font-size: 12px; color: var(--faint); margin-top: 4px; }
  .track-meta .live-tag { color: var(--accent); font-weight: 600; }
  .label-tag { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px; padding: 2px 7px; margin-left: 8px; vertical-align: middle; }

  .hero-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .hero-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .hero-label { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: 0.03em; margin-bottom: 6px; }
  .hero-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .hero-num { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
  .pill.up { color: var(--up); background: rgba(52,211,153,0.12); }
  .pill.down { color: var(--down); background: rgba(248,113,113,0.12); }
  .pill.flat { color: var(--faint); background: rgba(255,255,255,0.05); }

  .section { margin-bottom: 18px; }
  .section:last-child { margin-bottom: 0; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
  .section-title { font-size: 12.5px; font-weight: 700; color: var(--text); }
  .section-count { font-size: 11.5px; color: var(--faint); }

  .supporter-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .supporter { display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 8px 12px 8px 8px; }
  .supporter .ring { width: 30px; height: 30px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size: 12px; font-weight: 700; flex-shrink:0; color: #14140f; }
  .supporter .ring.tier-1 { background: var(--gold); }
  .supporter .ring.tier-2 { background: var(--silver); }
  .supporter .ring.tier-3 { background: var(--bronze); }
  .supporter .name { font-size: 13px; font-weight: 600; }
  .supporter .followers { font-size: 11px; color: var(--muted); }
  .empty-note { font-size: 12.5px; color: var(--faint); padding: 10px 0; }

  .duo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 980px) { .duo-grid { grid-template-columns: 1fr; } }

  .chart-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .chart-row:last-child { border-bottom: none; }
  .chart-row .cc { display: flex; align-items: center; gap: 8px; }
  .chart-row .flag { font-size: 16px; }
  .chart-row .place { font-size: 11px; color: var(--faint); }
  .chart-row.priority { background: rgba(91,124,250,0.06); border-radius: 6px; padding-left: 8px; padding-right: 8px; margin: 0 -8px; }

  .list-rows { display: flex; flex-direction: column; max-height: 320px; overflow-y: auto; padding-right: 4px; }
  .list-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .list-row:last-child { border-bottom: none; }
  .list-row .left { min-width: 0; flex: 1; display: flex; align-items: center; gap: 9px; }
  .row-art { width: 30px; height: 30px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--surface2); }
  .list-row .pname-wrap { min-width: 0; }
  .list-row .pname { font-size: 13.5px; font-weight: 500; color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .list-row .pname:hover { color: var(--accent); }
  .list-row .curator { font-size: 11.5px; color: var(--faint); margin-top: 1px; }
  .list-row .followers { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .tag-editorial { font-size: 10px; color: var(--faint); background: var(--surface2); padding: 1px 7px; border-radius: 99px; margin-left: 6px; }

  .track-art { width: 68px; height: 68px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: var(--surface2); box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  .track-head { position: relative; z-index: 1; }
  .card-wash { position: absolute; inset: 0; border-radius: 16px; opacity: 0; transition: opacity 0.4s; pointer-events: none; z-index: 0; }
  .track-card { position: relative; overflow: hidden; }
  .track-card > *:not(.card-wash) { position: relative; z-index: 1; }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; margin-bottom: 4px; }
  .back-link:hover { color: var(--accent); }

  .overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .overview-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; cursor: pointer; transition: border-color 0.15s; }
  .overview-tile:hover { border-color: var(--accent); }
  .ov-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .ov-name { font-size: 14.5px; font-weight: 700; }
  .ov-sub { font-size: 11px; color: var(--faint); margin-top: 2px; }
  .ov-spark { max-height: 36px; margin: 8px 0; }
  .ov-read { font-size: 12px; color: var(--muted); line-height: 1.4; margin-top: 8px; }
  .ov-read.pending { color: var(--faint); font-style: italic; }

  .trend-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .trend-badge.accelerating { color: var(--up); background: rgba(52,211,153,0.14); }
  .trend-badge.steady { color: var(--accent); background: rgba(91,124,250,0.13); }
  .trend-badge.plateauing { color: var(--gold); background: rgba(232,185,92,0.14); }
  .trend-badge.declining { color: var(--down); background: rgba(248,113,113,0.14); }
  .trend-badge.pending { color: var(--faint); background: rgba(255,255,255,0.05); }


  .status-banner { border-radius: 12px; padding: 14px 18px; margin-bottom: 20px; font-size: 13.5px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .status-banner.complete { background: linear-gradient(135deg, rgba(52,211,153,0.1), rgba(52,211,153,0.02)); border: 1px solid rgba(52,211,153,0.25); }
  .status-banner.pending { background: linear-gradient(135deg, rgba(232,185,92,0.1), rgba(232,185,92,0.02)); border: 1px solid rgba(232,185,92,0.25); }
  .status-banner .status-label { font-weight: 700; }
  .status-banner .status-detail { color: var(--muted); }
  .status-bar-track { flex: 1; min-width: 120px; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .status-bar-fill { height: 100%; background: var(--up); border-radius: 3px; transition: width 0.3s ease; }

  .trend-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 980px) { .trend-charts { grid-template-columns: 1fr; } }
  .trend-chart-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .trend-chart-box h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 10px; }

  /* ── Dashboard (Songstats signals) ───────────────────────────────── */
  .content { gap: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 20px 12px; }
  .panel-title { font-size: 15px; font-weight: 700; }
  .panel-sub { font-size: 12px; color: var(--faint); margin-top: 2px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip { font-size: 12px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border2); background: transparent; color: var(--muted); cursor: pointer; font-family: var(--sans); white-space: nowrap; }
  .chip:hover { color: var(--text); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* records table */
  .rt-row { display: grid; grid-template-columns: 40px minmax(220px, 2.2fr) 128px repeat(5, minmax(92px, 1fr)); gap: 14px; align-items: center; padding: 10px 20px; border-top: 1px solid var(--border); }
  .rt-row.rt-h { padding-top: 6px; padding-bottom: 6px; border-top: none; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--faint); }
  .rt-h .sortable { cursor: pointer; user-select: none; }
  .rt-h .sortable:hover, .rt-h .sorted { color: var(--text); }
  .rt-row.rec { cursor: pointer; transition: background 0.12s; }
  .rt-row.rec:hover { background: rgba(255,255,255,0.025); }
  .rt-row.rec.sel { background: rgba(91,124,250,0.09); box-shadow: inset 3px 0 0 var(--accent); }
  .rt-art { width: 40px; height: 40px; border-radius: 7px; object-fit: cover; background: var(--surface2); display: block; }
  .rt-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rt-why { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .rt-why .lab { color: var(--faint); }
  .rt-num { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .rt-pct { font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rt-pct.up { color: var(--up); } .rt-pct.down { color: var(--down); } .rt-pct.flat, .rt-pct.low { color: var(--faint); font-weight: 500; }
  .new-tag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.05em; color: #052e1f; background: var(--up); border-radius: 4px; padding: 1px 5px; vertical-align: 1px; }
  .mom { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .mom.accelerating { background: rgba(52,211,153,0.15); color: var(--up); }
  .mom.steady { background: rgba(91,124,250,0.15); color: #a5b4fc; }
  .mom.cooling { background: rgba(248,113,113,0.13); color: var(--down); }
  .mom.none { background: rgba(255,255,255,0.05); color: var(--faint); }

  /* record detail */
  .rd { padding: 22px 24px 24px; position: relative; overflow: hidden; }
  .rd > *:not(.card-wash) { position: relative; z-index: 1; }
  .rd-head { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
  .rd-head .track-art { width: 84px; height: 84px; }
  .rd-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
  .rd-artist { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .rd-meta { font-size: 11.5px; color: var(--faint); margin-top: 6px; }
  .rd-actions { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .rd-link { font-size: 12px; color: var(--muted); text-decoration: none; border: 1px solid var(--border2); border-radius: 8px; padding: 5px 10px; }
  .rd-link:hover { color: var(--text); border-color: var(--accent); }

  .why { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .why h4, .box h4 { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .why-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
  @media (max-width: 1100px) { .why-list { grid-template-columns: 1fr; } }
  .why-item { display: flex; gap: 9px; align-items: baseline; font-size: 13px; line-height: 1.4; }
  .why-item .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; transform: translateY(-1px); }
  .why-item .grp { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.04em; margin-left: 4px; white-space: nowrap; }

  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 12px; }
  @media (max-width: 1250px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; font-family: var(--sans); color: var(--text); transition: border-color 0.12s, background 0.12s; }
  .kpi:hover { border-color: var(--border2); }
  .kpi.on { border-color: var(--accent); background: rgba(91,124,250,0.08); }
  .kpi-label { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .kpi-num { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .kpi-sub { font-size: 11.5px; color: var(--faint); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .chart-box { margin-bottom: 18px; }
  .chart-legend { font-size: 11.5px; color: var(--faint); margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
  .chart-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); margin-right: 5px; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--muted); background: none; border: none; padding: 9px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .tab .n { font-size: 11px; color: var(--faint); margin-left: 4px; font-weight: 500; }

  .dsp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .dsp-grid { grid-template-columns: 1fr; } }
  .dsp-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .dsp-name { font-size: 13.5px; font-weight: 700; }
  .dsp-count { font-size: 11.5px; color: var(--faint); }
  .pl { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--border); }
  .pl:first-of-type { border-top: none; }
  .pl img, .pl .ph { width: 30px; height: 30px; border-radius: 6px; object-fit: cover; background: var(--surface2); }
  .pl-name { font-size: 13px; font-weight: 500; color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  a.pl-name:hover { color: var(--accent); }
  .pl-sub { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-right { text-align: right; font-variant-numeric: tabular-nums; }
  .pl-pos { font-size: 13px; font-weight: 700; }
  .pl-fol { font-size: 11px; color: var(--faint); }
  .scroll { max-height: 360px; overflow-y: auto; padding-right: 4px; }

  .m-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 12px; align-items: start; }
  .m-row { display: grid; grid-template-columns: 1fr 64px 60px; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--border); }
  .m-row:first-of-type { border-top: none; }
  .m-label { font-size: 12.5px; }
  .m-nums { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .m-pct { font-size: 12px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .m-row.low .m-label { color: var(--muted); }
  .m-tag { font-size: 10px; color: var(--faint); border: 1px dashed var(--border2); border-radius: 4px; padding: 0 4px; margin-left: 5px; }
  @media (max-width: 1000px) { .rt-row { grid-template-columns: 40px 1fr 110px; } .rt-row > .c-m { display: none; } }
</style>

<body>
<div class="shell">
  <aside class="side">
    <div class="side-top">
      <img id="logoImg" class="logo" src="" alt="Listen Up" onerror="this.style.display='none';document.getElementById('logoFallback').style.display='block'">
      <div id="logoFallback" class="logo-fallback"><span class="bar"></span>LISTEN UP</div>
      <div class="side-title">Long Term Target Tracking</div>
      <div class="side-sub">live editorial &amp; independent movement</div>
    </div>

    <div class="side-block">
      <div class="block-label">Settings <button class="link" onclick="toggleSettings()">edit</button></div>
      <div id="settingsForm" style="display:none;">
        <label class="field-label">GitHub owner/org</label>
        <input type="text" id="ghOwner" placeholder="e.g. mattrimmo">
        <label class="field-label">Repo name</label>
        <input type="text" id="ghRepo" placeholder="e.g. targettracking">
        <label class="field-label">GitHub token (write access to this repo)</label>
        <input type="password" id="ghToken" placeholder="paste token — kept in this browser only">
        <label class="field-label">Spotify Client ID</label>
        <input type="text" id="spId" placeholder="for searching tracks to add">
        <label class="field-label">Spotify Client Secret</label>
        <input type="password" id="spSecret" placeholder="for searching tracks to add">
        <button class="btn-accent" onclick="saveSettings()">Save</button>
      </div>
      <div id="settingsSummary" style="font-size:12px;color:var(--muted)"></div>
    </div>

    <div class="side-block">
      <div class="block-label">Add a track</div>
      <input type="text" id="q" placeholder="Search title/artist, or paste Spotify link">
      <button class="btn-accent" id="searchBtn" onclick="doSearch()">Search</button>
      <div class="notice" id="searchNotice"></div>
      <div class="results" id="results"></div>
      <div id="pendingAdd" style="display:none; margin-top:10px; padding:10px; background:var(--surface); border:1px solid var(--border2); border-radius:8px;">
        <div style="font-size:13px;font-weight:600;" id="pendingName"></div>
        <label class="field-label">Label</label>
        <input type="text" id="pendingLabel" placeholder="Fills in automatically; if empty, leave blank">
        <button class="btn-accent" onclick="confirmAddTrack()">Add to tracking</button>
      </div>
    </div>

    <div class="side-block">
      <div class="block-label">Currently tracked <span id="trackedCount" style="font-size:12px;color:var(--faint)"></span></div>
      <div id="trackedList"></div>
    </div>

    <div class="side-block">
      <div class="block-label">Sync</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:2px;" id="lastSyncNote">—</div>
      <button class="btn-accent" onclick="checkLiveNow()" id="liveBtn">Check live now</button>
      <div class="notice" id="syncNotice"></div>
    </div>

    <div class="side-block">
      <div class="block-label">Labels</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:2px;">Backfills any already-tracked track that has no label saved yet.</div>
      <button class="btn-accent" onclick="backfillLabels()" id="backfillBtn">Backfill missing labels</button>
      <div class="notice" id="backfillNotice"></div>
    </div>

    <div class="debug-area">
      <div class="debug-label"><span>Debug</span><button class="debug-clear" onclick="document.getElementById('debugBox').textContent=''">clear</button></div>
      <div id="debugBox"></div>
    </div>
  </aside>

  <main class="main">
    <div class="main-header">
      <div>
        <div class="main-title" id="mainTitle">Target Tracking</div>
        <div class="main-sub" id="mainSub">Official week-on-week movement, refreshed every Wednesday</div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// SETTINGS (localStorage only — nothing here is committed to the repo)
// ─────────────────────────────────────────────────────────────────────────────
function getSettings() {
  return {
    owner:  localStorage.getItem('ltt_owner')  || '',
    repo:   localStorage.getItem('ltt_repo')   || '',
    token:  localStorage.getItem('ltt_token')  || '',
    spId:   localStorage.getItem('ltt_spid')   || '',
    spSecret: localStorage.getItem('ltt_spsecret') || '',
  };
}
function toggleSettings() {
  const f = document.getElementById('settingsForm');
  const s = getSettings();
  document.getElementById('ghOwner').value = s.owner;
  document.getElementById('ghRepo').value  = s.repo;
  document.getElementById('ghToken').value = s.token;
  document.getElementById('spId').value = s.spId;
  document.getElementById('spSecret').value = s.spSecret;
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}
function saveSettings() {
  localStorage.setItem('ltt_owner', document.getElementById('ghOwner').value.trim());
  localStorage.setItem('ltt_repo',  document.getElementById('ghRepo').value.trim());
  localStorage.setItem('ltt_token', document.getElementById('ghToken').value.trim());
  localStorage.setItem('ltt_spid', document.getElementById('spId').value.trim());
  localStorage.setItem('ltt_spsecret', document.getElementById('spSecret').value.trim());
  document.getElementById('settingsForm').style.display = 'none';
  renderSettingsSummary();
  dbg('Settings saved locally.');
}
function renderSettingsSummary() {
  const s = getSettings();
  document.getElementById('settingsSummary').textContent =
    (s.owner && s.repo) ? `${s.owner}/${s.repo}` : 'Not configured yet — click edit';
}
// ─────────────────────────────────────────────────────────────────────────────
// DEBUG / NOTICE HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function dbg(msg) {
  const box = document.getElementById('debugBox');
  const ts  = new Date().toTimeString().slice(0,8);
  box.textContent += ts + '  ' + msg + '\n';
  box.scrollTop = box.scrollHeight;
  console.log('[LTT]', msg);
}
function notice(id, text, type) {
  const el = document.getElementById(id);
  el.className = 'notice show ' + type;
  el.innerHTML = (type === 'loading' ? '<span class="spin"></span>' : '') + text;
}
function hideNotice(id) { document.getElementById(id).className = 'notice'; }
const fmtNum = n => (n == null ? '—' : Number(n).toLocaleString('en-GB'));
const trunc  = (s, n) => (s && s.length > n ? s.slice(0, n) + '…' : (s || ''));
function pill(d) {
  if (d === null || d === undefined) return '<span class="pill flat">first snapshot</span>';
  if (d > 0) return `<span class="pill up">▲ ${d.toLocaleString('en-GB')}</span>`;
  if (d < 0) return `<span class="pill down">▼ ${Math.abs(d).toLocaleString('en-GB')}</span>`;
  return '<span class="pill flat">— no change</span>';
}
function countryFlag(code) {
  if (!code || code === 'GLOBAL') return '🌐';
  return code.toUpperCase().replace(/./g, c => String.fromCodePoint(127397 + c.charCodeAt(0)));
}
function chartPositionPill(position, previousPosition) {
  // Lower chart position number is better, so this is inverted vs pill() —
  // moving from #36 to #20 is an improvement, not a decrease.
  if (previousPosition === null || previousPosition === undefined) return '<span class="pill flat">new</span>';
  const diff = previousPosition - position;
  if (diff > 0) return `<span class="pill up">▲ ${diff}</span>`;
  if (diff < 0) return `<span class="pill down">▼ ${Math.abs(diff)}</span>`;
  return '<span class="pill flat">—</span>';
}
function shazamChartRows(charts) {
  if (!charts || !charts.length) return '<div class="empty-note">Not currently charting anywhere on Shazam.</div>';
  // UK entries first (both plain UK and any UK genre/city breakdowns), then
  // GLOBAL, then everything else — storage keeps all countries regardless,
  // this ordering is purely how it's displayed.
  const sorted = [...charts].sort((a, b) => {
    const rank = c => c.country_code === 'GB' ? 0 : c.country_code === 'GLOBAL' ? 1 : 2;
    return rank(a) - rank(b) || (a.position || 0) - (b.position || 0);
  });
  return '<div class="list-rows">' + sorted.map(c => `
    <div class="chart-row ${c.country_code === 'GB' ? 'priority' : ''}">
      <div class="cc">
        <span class="flag">${countryFlag(c.country_code)}</span>
        <div>
          <div>#${c.position}${c.type === 'discovery' ? ' <span class="place">(discovery)</span>' : ''}</div>
          ${(c.genre || c.city) ? `<div class="place">${[c.genre, c.city].filter(Boolean).join(' · ')}</div>` : ''}
        </div>
      </div>
      ${chartPositionPill(c.position, c.previous_position)}
    </div>`).join('') + '</div>';
}
function initials(name) {
  return (name || '?').trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();
}
// ─────────────────────────────────────────────────────────────────────────────
// GITHUB API — read/write the shared data files + trigger the sync workflow
// ─────────────────────────────────────────────────────────────────────────────
async function ghApi(path, opts) {
  const s = getSettings();
  if (!s.owner || !s.repo || !s.token) throw new Error('Set up GitHub owner/repo/token in Settings first.');
  opts = opts || {};
  const res = await fetch('https://api.github.com/repos/' + s.owner + '/' + s.repo + path, {
    ...opts,
    headers: {
      'Authorization': 'token ' + s.token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.headers || {})
    }
  });
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    throw new Error('GitHub API ' + res.status + ': ' + body.slice(0, 200));
  }
  return res.status === 204 ? null : res.json();
}
async function ghGetFile(path) {
  const d = await ghApi('/contents/' + path);
  const content = JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g, '')))));
  return { content, sha: d.sha };
}
async function ghPutFile(path, contentObj, sha, message) {
  const json = JSON.stringify(contentObj, null, 2) + '\n';
  const b64  = btoa(unescape(encodeURIComponent(json)));
  return ghApi('/contents/' + path, {
    method: 'PUT',
    body: JSON.stringify({ message, content: b64, sha })
  });
}
async function ghTriggerSync(official) {
  await ghApi('/actions/workflows/sync.yml/dispatches', {
    method: 'POST',
    body: JSON.stringify({ ref: 'main', inputs: { official: official ? 'true' : 'false' } })
  });
}
async function ghLatestRun() {
  const d = await ghApi('/actions/workflows/sync.yml/runs?per_page=1&event=workflow_dispatch');
  return d.workflow_runs && d.workflow_runs[0];
}
// ─────────────────────────────────────────────────────────────────────────────
// SPOTIFY — client credentials, browser-side (public catalogue only, low risk)
// ─────────────────────────────────────────────────────────────────────────────
let _spToken = null, _spExpAt = 0;
async function spToken() {
  const s = getSettings();
  if (!s.spId || !s.spSecret) throw new Error('Set Spotify Client ID/Secret in Settings to search for tracks.');
  if (_spToken && Date.now() < _spExpAt) return _spToken;
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: {
      'Authorization': 'Basic ' + btoa(s.spId + ':' + s.spSecret),
      'Content-Type': 'application/x-www-form-urlencoded'
    },
    body: 'grant_type=client_credentials'
  });
  if (!res.ok) throw new Error('Spotify auth failed ' + res.status);
  const data = await res.json();
  _spToken = data.access_token;
  _spExpAt = Date.now() + (data.expires_in - 30) * 1000;
  return _spToken;
}
async function spGet(path) {
  const tok = await spToken();
  const res = await fetch('https://api.spotify.com/v1' + path, { headers: { 'Authorization': 'Bearer ' + tok } });
  if (!res.ok) throw new Error('Spotify ' + res.status + ' on ' + path);
  return res.json();
}
// ─────────────────────────────────────────────────────────────────────────────
// SEARCH (to add a track)
// ─────────────────────────────────────────────────────────────────────────────
async function doSearch() {
  const raw = document.getElementById('q').value.trim();
  if (!raw) return;
  const btn = document.getElementById('searchBtn');
  btn.disabled = true; btn.textContent = 'Searching…';
  document.getElementById('results').innerHTML = '';
  notice('searchNotice', 'Searching Spotify…', 'loading');
  try {
    const trackMatch = raw.match(/open\.spotify\.com\/track\/([A-Za-z0-9]+)/);
    let items = [];
    if (trackMatch) {
      const t = await spGet('/tracks/' + trackMatch[1]);
      items = [t];
    } else {
      const d = await spGet('/search?q=' + encodeURIComponent(raw) + '&type=track&limit=6');
      items = d.tracks ? d.tracks.items : [];
    }
    hideNotice('searchNotice');
    if (!items.length) { notice('searchNotice', 'No results found.', 'error'); }
    const container = document.getElementById('results');
    items.forEach(t => {
      const img = t.album && t.album.images && t.album.images[2] ? t.album.images[2].url : (t.album && t.album.images && t.album.images[0] ? t.album.images[0].url : '');
      const el = document.createElement('div');
      el.className = 'result-item';
      el.innerHTML = (img ? `<img class="result-art" src="${img}">` : '<div class="result-art"></div>') +
        `<div style="flex:1;min-width:0;">
          <div class="result-name">${t.name}</div>
          <div class="result-sub">${t.artists.map(a=>a.name).join(' & ')}</div>
        </div>`;
      el.addEventListener('click', () => selectTrackForAdd(t));
      container.appendChild(el);
    });
  } catch (e) {
    notice('searchNotice', e.message, 'error');
    dbg('SEARCH ERROR: ' + e.message);
  }
  btn.disabled = false; btn.textContent = 'Search';
}
// ─────────────────────────────────────────────────────────────────────────────
// ADD / REMOVE TRACKED TRACKS  (commits directly to tracked.json via GitHub API)
// ─────────────────────────────────────────────────────────────────────────────
let _pendingTrack = null;

async function lookupLabelByIsrc(isrc) {
  try {
    const found = await spGet('/search?q=isrc:' + isrc + '&type=track&limit=1');
    const track = found && found.tracks && found.tracks.items && found.tracks.items[0];
    const albumId = track && track.album && track.album.id;
    if (!albumId) return null;
    const album = await spGet('/albums/' + albumId);
    if (album.label && album.label !== 'INDEPENDENT') return album.label.toUpperCase();
    return null;
  } catch (e) {
    dbg('Label backfill lookup failed for ' + isrc + ': ' + e.message);
    return null;
  }
}

async function backfillLabels() {
  const btn = document.getElementById('backfillBtn');
  btn.disabled = true;
  notice('backfillNotice', 'Reading tracked list…', 'loading');
  try {
    const { content, sha } = await ghGetFile('data/tracked.json');
    const needsLabel = content.tracks.filter(t => !t.label);
    if (!needsLabel.length) {
      notice('backfillNotice', 'Every tracked track already has a label saved.', 'success');
      btn.disabled = false;
      return;
    }

    let found = 0, defaulted = 0;
    for (let i = 0; i < needsLabel.length; i++) {
      const t = needsLabel[i];
      notice('backfillNotice', `Checking ${i + 1} of ${needsLabel.length}: ${t.artist} - ${t.track}…`, 'loading');
      const label = await lookupLabelByIsrc(t.isrc);
      t.label = label || 'INDEPENDENT';
      if (label) { found++; dbg('Backfilled label for ' + t.isrc + ': ' + label); }
      else { defaulted++; dbg('No label found for ' + t.isrc + ' — defaulted to INDEPENDENT.'); }
    }

    // Re-fetch immediately before writing, in case anything else changed
    // tracked.json while this loop was running (same race-condition guard
    // used elsewhere) — merge our label updates onto the current version.
    const fresh = await ghGetFile('data/tracked.json');
    const byIsrc = Object.fromEntries(needsLabel.map(t => [t.isrc, t.label]));
    fresh.content.tracks.forEach(t => { if (byIsrc[t.isrc] && !t.label) t.label = byIsrc[t.isrc]; });

    await ghPutFile('data/tracked.json', fresh.content, fresh.sha, `Backfill labels for ${needsLabel.length} track(s)`);
    notice('backfillNotice', `✓ Done — found real labels for ${found}, defaulted ${defaulted} to INDEPENDENT (Spotify had nothing for those).`, 'success');
    setTimeout(loadAll, 1500);
  } catch (e) {
    notice('backfillNotice', e.message, 'error');
    dbg('BACKFILL ERROR: ' + e.message);
  }
  btn.disabled = false;
}

async function selectTrackForAdd(spotifyTrack) {
  _pendingTrack = spotifyTrack;
  document.getElementById('pendingName').textContent = spotifyTrack.artists.map(a => a.name).join(' & ') + ' - ' + spotifyTrack.name;
  const labelInput = document.getElementById('pendingLabel');
  labelInput.value = '';
  document.getElementById('pendingAdd').style.display = 'block';

  // Auto-fill the label from Spotify's album object. Spotify removed `label` for newer
  // apps (Feb 2026), but an older app can still return it, so this only works when the
  // Client ID/Secret saved in Settings belong to the OLDER Spotify app.
  // If nothing comes back, leave the box blank: the daily sync fills it in later.
  try {
    const albumId = spotifyTrack.album && spotifyTrack.album.id;
    if (albumId) {
      const album = await spGet('/albums/' + albumId);
      if (album.label && album.label !== 'INDEPENDENT') {
        labelInput.value = album.label.toUpperCase();
        dbg('Label auto-filled: ' + album.label);
      } else {
        dbg('Spotify returned no label for this album (the Spotify app in Settings may be the newer one).');
      }
    }
  } catch (e) {
    dbg('Label lookup failed: ' + e.message);
  }
}

async function confirmAddTrack() {
  if (!_pendingTrack) return;
  const label = document.getElementById('pendingLabel').value.trim();
  await addTrack(_pendingTrack, label);
  document.getElementById('pendingAdd').style.display = 'none';
  _pendingTrack = null;
}

async function addTrack(spotifyTrack, label) {
  const isrc = spotifyTrack.external_ids && spotifyTrack.external_ids.isrc;
  if (!isrc) { notice('searchNotice', 'No ISRC found for this track.', 'error'); return; }
  notice('searchNotice', 'Adding to tracked list…', 'loading');
  try {
    const { content, sha } = await ghGetFile('data/tracked.json');
    if (content.tracks.some(t => t.isrc === isrc)) {
      notice('searchNotice', 'Already tracked.', 'error');
      return;
    }
    content.tracks.push({
      isrc,
      artist: spotifyTrack.artists.map(a => a.name).join(' & '),
      track:  spotifyTrack.name,
      label:  label || '',
      image:  (spotifyTrack.album && spotifyTrack.album.images && (spotifyTrack.album.images[1] || spotifyTrack.album.images[0]) || {}).url || null,
      added_at: new Date().toISOString().slice(0, 10)
    });
    await ghPutFile('data/tracked.json', content, sha, `Add track: ${spotifyTrack.artists[0].name} - ${spotifyTrack.name}`);
    notice('searchNotice', '✓ Added. Run "Check live now" to pull its first snapshot (the label fills in automatically).', 'success');
    document.getElementById('results').innerHTML = '';
    document.getElementById('q').value = '';
    dbg('Added ' + isrc);
    setTimeout(loadAll, 1500);
  } catch (e) {
    notice('searchNotice', e.message, 'error');
    dbg('ADD ERROR: ' + e.message);
  }
}
async function removeTrack(isrc, label) {
  if (!confirm('Remove "' + label + '" from tracking? History is kept, it just stops updating.')) return;
  notice('syncNotice', 'Removing…', 'loading');
  try {
    const { content, sha } = await ghGetFile('data/tracked.json');
    content.tracks = content.tracks.filter(t => t.isrc !== isrc);
    await ghPutFile('data/tracked.json', content, sha, `Remove track: ${label}`);
    notice('syncNotice', '✓ Removed.', 'success');
    setTimeout(loadAll, 1500);
  } catch (e) {
    notice('syncNotice', e.message, 'error');
    dbg('REMOVE ERROR: ' + e.message);
  }
}
// ─────────────────────────────────────────────────────────────────────────────
// CHECK LIVE NOW — triggers the Actions workflow, polls until it finishes
// ─────────────────────────────────────────────────────────────────────────────
async function checkLiveNow() {
  const btn = document.getElementById('liveBtn');
  btn.disabled = true;
  notice('syncNotice', 'Triggering sync on GitHub Actions…', 'loading');
  try {
    // Snapshot the currently-live data BEFORE triggering, so we can tell
    // once GitHub Pages has actually rebuilt with the new commit — a fixed
    // 15s wait guessed wrong often enough that the page looked "not
    // updating" even when the sync itself had succeeded.
    let before = null;
    try { before = JSON.stringify(await fetchJson('data/history.json')); } catch (e) { /* fine, treat as no baseline */ }

    await ghTriggerSync(false); // never touches the official weekly delta
    await new Promise(r => setTimeout(r, 4000)); // give the run a moment to register
    let run = await ghLatestRun();
    let tries = 0;
    while (run && run.status !== 'completed' && tries < 40) {
      notice('syncNotice', 'Running… (' + run.status + ')', 'loading');
      await new Promise(r => setTimeout(r, 5000));

  if (_tab === 'independent') {
    if (!latest) return '<div class="empty-note">No weekly playlist snapshot yet. Click "Check live now".</div>';
    const ind = latest.independent_playlists.map(p => ({ name: p.name, followers: p.followers, position: p.position, added_at: p.added_at,
      url: 'https://open.spotify.com/playlist/' + p.spotify_id, image: p.cover_url, curator: p.owner_name }));
    return `<div class="kpis" style="grid-template-columns:repeat(3,1fr)">
        <div class="kpi" style="cursor:default"><div class="kpi-label">Independent followers</div><div class="kpi-num">${shortNum(latest.independent_followers_total)}</div><div class="kpi-sub">${pill(latest.independent_followers_delta)} vs last snapshot</div></div>
        <div class="kpi" style="cursor:default"><div class="kpi-label">Independent playlists</div><div class="kpi-num">${ind.length}</div><div class="kpi-sub">Spotify, 100+ followers</div></div>
        <div class="kpi" style="cursor:default"><div class="kpi-label">Key supporters</div><div class="kpi-num">${latest.key_supporters.length}</div><div class="kpi-sub">from your curator list</div></div>
      </div>
      ${latest.key_supporters.length ? `<div class="box" style="margin-bottom:12px"><h4>Key supporters</h4>${supporterRow(latest.key_supporters)}</div>` : ''}
      ${dspBox('All independent placements on Spotify', ind, 'None currently.')}`;
  }
  if (_tab === 'charts') {
    const bp = pl.beatport || [], dj = pl.beatport_dj || [];
    return `<div class="dsp-grid">
      <div class="box"><div class="dsp-head"><span class="dsp-name">Shazam charts</span><span class="dsp-count">${((latest && latest.shazam_charts) || []).length}</span></div>${shazamChartRows((latest && latest.shazam_charts) || [])}</div>
      ${dspBox('Beatport charts', bp, 'Not in a Beatport Top 100 or feature right now.')}
      ${dspBox('Beatport DJ charts (latest 30)', dj.map(p => Object.assign({}, p, { added_at: null, _d: p.added_at })), 'No DJ charts yet.', p => ({ sub: (p.owner || '') + (p._d ? ' · ' + shortDate(p._d) : ''), right: `<div class="pl-pos">${p.position ? '#' + p.position : ''}</div>` }))}
    </div>`;
  }
  if (!rec) return '<div class="empty-note">No Songstats metrics yet.</div>';
  const groups = ['Streaming', 'Discovery', 'Social', 'DJ & club'].map(g => {
    const ms = rec.metrics.filter(m => m.group === g);
    if (!ms.length) return '';
    return `<div class="box"><h4>${g}</h4>${ms.map(m => {
      const col = m.low_volume ? 'var(--faint)' : m.pct > 0 ? 'var(--up)' : m.pct < 0 ? 'var(--down)' : 'var(--muted)';
      const nums = m.kind === 'flow' ? `${shortNum(m.week)} this week · ${shortNum(m.prev)} last week · ${shortNum(m.total)} total` : `${shortNum(m.week)} now · ${shortNum(m.prev)} a week ago`;
      return `<div class="m-row ${m.low_volume ? 'low' : ''}"><div><div class="m-label">${esc(m.label)}${m.low_volume ? '<span class="m-tag">low volume</span>' : ''}</div><div class="m-nums">${nums}</div></div>
        <div title="last 8 weeks">${sparkSvg(m.spark, (m.pct || 0) >= 0)}</div>
        <div class="m-pct" style="color:${col}">${m.pct === null || m.pct === undefined ? '—' : (m.pct > 0 ? '+' : '') + m.pct + '%'}</div></div>`;
    }).join('')}</div>`;
  }).join('');
  return `<div class="m-groups">${groups}</div>
    <div class="chart-legend" style="margin-top:10px">Sparklines show the last 8 weeks. "Low volume" means both weeks are under a small floor, so the % is shown but doesn't count towards momentum.</div>`;
}

const KEY_MARKETS = ['GB', 'US', 'DE', 'FR', 'NL', 'AU', 'CA', 'IT', 'ES', 'JP', 'BR', 'MX', 'IE', 'BE', 'SE'];
function marketList(m) {
  if (!m || !m.length) return '';
  const r = c => { const i = KEY_MARKETS.indexOf(c); return i < 0 ? 99 : i; };
  const s = [...m].sort((a, b) => r(a) - r(b) || a.localeCompare(b));
  return s.length > 5 ? s.slice(0, 5).join(', ') + ' +' + (s.length - 5) + ' more' : s.join(', ');
}
// daily chart: 7-day average as the main line, raw daily faint behind it, editorial adds marked
function drawChart(r) {
  const rec = r && r.rec;
  const canvas = document.getElementById('dailyChart');
  if (_chart) { _chart.destroy(); _chart = null; }
  if (!rec || !rec.daily || !canvas) return;
  if (!rec.daily[_chartKey]) _chartKey = Object.keys(rec.daily)[0];
  const d = rec.daily[_chartKey];
  if (!d) return;
  document.getElementById('chartTitle').textContent = d.label.replace(/^Daily /, '') + ' · daily, last ' + d.dates.length + ' days';
  const adds = {};
  Object.entries(r.ed.sets).forEach(([k, l]) => l.forEach(p => {
    if (p.added_at) (adds[p.added_at] = adds[p.added_at] || []).push(p.name + ' (' + (DSPS.find(x => x[0] === k) || [k, k])[1] + ')');
  }));
  const isFlow = _chartKey !== 'spotify_reach';
  const avg = d.values.map((v, i) => { const w = d.values.slice(Math.max(0, i - 6), i + 1); return i < 6 ? null : Math.round(w.reduce((a, b) => a + b, 0) / w.length); });
  const main = isFlow ? avg : d.values;
  const marks = d.dates.map((dt, i) => adds[dt] ? (main[i] !== null ? main[i] : d.values[i]) : null);
  const nMarks = marks.filter(x => x !== null).length;
  document.getElementById('chartLegend').innerHTML = (isFlow ? '<span><i style="background:#5b7cfa"></i>7-day average</span><span><i style="background:#3a3f5c"></i>Daily</span>' : '') + (nMarks ? '<span><i></i>Editorial add (hover for the playlist)</span>' : '');
  _chart = new Chart(canvas, {
    type: 'line',
    data: { labels: d.dates, datasets: [
      { data: main, borderColor: '#5b7cfa', backgroundColor: '#5b7cfa22', fill: true, borderWidth: 2.2, pointRadius: 0, pointHitRadius: 6, tension: 0.35, order: 2, spanGaps: true },
      { data: isFlow ? d.values : [], borderColor: 'rgba(140,150,200,0.35)', borderWidth: 1, pointRadius: 0, tension: 0.2, order: 3, fill: false },
      { data: marks, showLine: false, pointRadius: 5, pointHoverRadius: 7, pointBackgroundColor: '#e8b95c', pointBorderColor: '#101014', pointBorderWidth: 2, order: 1 }
    ] },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { callbacks: {
        title: items => shortDate(items[0].label),
        label: item => item.raw === null || item.datasetIndex === 2 ? null : (isFlow ? (item.datasetIndex === 0 ? ' 7-day avg ' : ' Daily ') : ' ') + Number(item.raw).toLocaleString('en-GB'),
        afterBody: items => (adds[items[0].label] || []).map(n => '+ ' + n) } } },
      scales: { x: { ticks: { color: '#55555f', font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 9, callback: function (v) { return shortDate(this.getLabelForValue(v)); } }, grid: { display: false } },
                y: { ticks: { color: '#55555f', font: { size: 10 }, callback: v => shortNum(v) }, grid: { color: 'rgba(255,255,255,0.05)' } } } }
  });
}

// ── wiring ─────────────────────────────────────────────────────────────────
function currentRow() {
  if (!_lastTracked) return null;
  return rowsFor(_lastTracked, _lastHistory, _lastSignals).find(r => r.t.isrc === _sel) || null;
}
function renderAllCards(tracked, history, pulse, signals) {
  document.getElementById('mainTitle').textContent = 'Target Tracking';
  document.getElementById('mainSub').textContent = 'Everything each record is doing: streaming, editorial, Shazam, socials and DJ support. Updated daily from Songstats.';
  const content = document.getElementById('content');
  if (!tracked.tracks.length) {
    content.innerHTML = `<div class="empty-state"><div class="empty-icon">◎</div><div>Nothing tracked yet.<br>Search for a track on the left to start following it.</div></div>`;
    return;
  }
  if (!_sel || !tracked.tracks.some(t => t.isrc === _sel)) {
    const fromHash = decodeURIComponent((location.hash || '').slice(1));
    _sel = tracked.tracks.some(t => t.isrc === fromHash) ? fromHash : sortRows(rowsFor(tracked, history, signals))[0].t.isrc;
  }
  let banner = '';
  let pending = 0;
  tracked.tracks.forEach(t => { const s = (history.snapshots || {})[t.isrc]; if (s && s.length) pending += s[s.length - 1].unclassified_count || 0; });
  if (pending) banner = `<div class="status-banner pending"><div><span class="status-label">${fmtNum(pending)} playlists still to classify</span> <span class="status-detail">· picked up automatically on the next sync runs.</span></div></div>`;
  content.innerHTML = banner + renderTable(tracked, history, signals) + renderDetail(currentRow());
  drawChart(currentRow());
}
function refreshTable() {
  const el = document.getElementById('recordsPanel');
  if (el) el.outerHTML = renderTable(_lastTracked, _lastHistory, _lastSignals);
}
function selectRecord(isrc, scroll) {
  _sel = isrc;
  history.replaceState(null, '', '#' + encodeURIComponent(isrc));
  refreshTable();
  const el = document.getElementById('recordDetail');
  const r = currentRow();
  if (el) el.outerHTML = renderDetail(r);
  drawChart(r);
  applyArtworkWash();
  backfillMissingArt({ tracks: r ? [r.t] : [] });
  const d = document.getElementById('recordDetail');
  if (d && scroll !== false) d.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function setFilter(k) { _filter = k; refreshTable(); }
function setSort(k) { _sortKey = k; refreshTable(); }
function setTab(k, scroll) {
  _tab = k;
  document.querySelectorAll('#recordDetail .tab').forEach(b => b.classList.toggle('on', b.getAttribute('onclick').includes("'" + k + "'")));
  document.getElementById('tabBody').innerHTML = tabBody(currentRow());
  if (scroll) document.querySelector('#recordDetail .tabs').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function setChart(k) {
  _chartKey = k;
  document.querySelectorAll('#recordDetail .kpi').forEach(b => b.classList.toggle('on', (b.getAttribute('onclick') || '').includes("'" + k + "'")));
  drawChart(currentRow());
}
async function loadAll() {
  try {
    const [tracked, history, pulse, signals] = await Promise.all([
      fetchJson('data/tracked.json'), fetchJson('data/history.json'), fetchJson('data/pulse.json'),
      fetchJson('data/signals.json').catch(() => ({ records: {} }))
    ]);
    _lastTracked = tracked; _lastHistory = history; _lastPulse = pulse; _lastSignals = signals;
    renderTrackedList(tracked);
    renderAllCards(tracked, history, pulse, signals);
    applyArtworkWash();
    backfillMissingArt(tracked);
    let latestDate = null;
    Object.values(history.snapshots || {}).forEach(list => {
      const d = list[list.length - 1];
      if (d && (!latestDate || d.date > latestDate)) latestDate = d.date;
    });
    let latestPulseDate = null;
    Object.values(pulse || {}).forEach(list => {
      const d = list[list.length - 1];
      if (d && (!latestPulseDate || d.date > latestPulseDate)) latestPulseDate = d.date;
    });
    document.getElementById('lastSyncNote').textContent =
      (latestDate ? ('Weekly: ' + latestDate) : 'No weekly data yet') +
      (latestPulseDate ? (' · Pulse: ' + latestPulseDate) : '');
    dbg('Loaded ' + tracked.tracks.length + ' tracked track(s).');
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="empty-state"><div class="empty-icon">!</div><div>${e.message}</div></div>`;
    dbg('LOAD ERROR: ' + e.message);
  }
}
// ─────────────────────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
document.getElementById('logoImg').src = 'logo.png?v=' + Date.now();
renderSettingsSummary();
loadAll();
</script>
